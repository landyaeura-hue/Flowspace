# Builds FlowSpace and publishes it to GitHub Pages on every push to main.
# Site: https://landyaeura-hue.github.io/Flowspace/
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        # Both values are public (the publishable key is meant for browsers; data is protected by RLS).
        env:
          VITE_SUPABASE_URL: https://suaxeumpmmdqztknplii.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_anMLoZ6-h4kbJ_sNDleGEg_BE3nbOHf
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
